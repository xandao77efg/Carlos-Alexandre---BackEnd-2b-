<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Painel de Alunos</title>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Alunos</h1>
            <p>Demonstração de CRUD Frontend/Backend (Node.js)</p>

            <button
                type="button"
                onclick="window.print()"
                style="margin-top: 1rem; padding: 10px 20px;
                font-weight: bold; cursor: pointer;
                border-radius: 8px; border: none;
                background: white; color: #1e3a8a;"
            >
                ⬇️ Baixar PDF
            </button>
        </header>

        <main>
            <section class="form-section">
                <h2 id="form-titulo">Novo Aluno</h2>

                <form id="aluno-form">
                    <input type="hidden" id="aluno-id">

                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input
                            type="text"
                            id="nome"
                            required
                            placeholder="Ex: João da Silva"
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="Ex: joao@email.com"
                        >
                    </div>

                    <div class="input-group">
                        <label for="idade">Idade</label>
                        <input
                            type="number"
                            id="idade"
                            required
                            min="1"
                            step="1"
                            placeholder="Ex: 20"
                        >
                    </div>

                    <div class="input-group">
                        <label for="curso">Curso</label>
                        <select id="curso" required>
                            <option value="">Selecione um curso...</option>
                            <option value="Análise de Sistemas">
                                Análise de Sistemas
                            </option>
                            <option value="Engenharia de Software">
                                Engenharia de Software
                            </option>
                            <option value="Ciência da Computação">
                                Ciência da Computação
                            </option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button
                            type="button"
                            class="btn-cancel"
                            id="btn-cancel"
                            style="display: none;"
                        >
                            Cancelar Edição
                        </button>

                        <button
                            type="submit"
                            class="btn-save"
                            id="btn-save"
                        >
                            Salvar Aluno
                        </button>
                    </div>

                    <p id="mensagem" role="status" aria-live="polite"></p>
                </form>
            </section>

            <section class="list-section">
                <h2>Alunos Cadastrados</h2>

                <button type="button" id="btn-atualizar">
                    Atualizar Lista
                </button>

                <p id="lista-mensagem" role="status"></p>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Idade</th>
                                <th>Curso</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="alunos-tbody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
